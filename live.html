canvas,video,img{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}</style></head><body>
<canvas id="c"></canvas><video id="v" muted loop autoplay playsinline></video><img id="i">
<script>
const q = new URLSearchParams(location.search);
const type = q.get('type'), name = q.get('name'), src = q.get('src');
const url = src ? 'file:///' + encodeURI(src.replace(/\\/g, '/')) : '';
const c = document.getElementById('c'), v = document.getElementById('v'), im = document.getElementById('i');
let paused = false, raf = 0, frame = null;

// ---- Black hole: real-time ray tracing on the GPU (WebGL) ----
// Light rays are bent with the Schwarzschild equation a = -1.5 * h^2 * p / r^5 (horizon radius = 1), so the lensing,
// the "halo" of the far side of the disk bending over the top, and the Doppler-bright side all come out of the physics.
const BH_FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uT;
#define RIN 3.0
#define ROUT 11.5
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float h31(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y); }
float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * vn(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return v; }
vec3 stars(vec3 d){
  vec3 col = vec3(0.0);
  for (int L = 0; L < 2; L++) {
    float sc = L == 0 ? 150.0 : 75.0;
    vec3 q = d * sc, id = floor(q), f = fract(q) - 0.5;
    float h = h31(id + float(L) * 7.0);
    if (h > 0.955) {
      float m = h31(id + 3.3);
      float s = smoothstep(0.2, 0.0, length(f)) * (0.25 + 1.6 * m * m);
      col += s * vec3(0.78 + 0.22 * h31(id + 1.0), 0.86, 1.0 - 0.3 * h31(id + 2.0)) * (L == 0 ? 1.0 : 1.7);
    }
  }
  float band = exp(-pow(d.y * 2.6 + 0.25 * sin(d.x * 2.4 + 0.6), 2.0));
  col += vec3(0.07, 0.065, 0.09) * band * (0.4 + fbm(d.xz * 9.0 + d.y * 4.0));
  return col;
}
vec3 tc(float t){ t = clamp(t, 0.0, 1.6); return vec3(1.0, 0.16 + 0.64 * pow(t, 1.3), 0.015 + 0.55 * pow(t, 2.8)); }
vec4 disk(vec3 hit, vec3 v){
  float r = length(hit.xz), u = (r - RIN) / (ROUT - RIN);
  float a = atan(hit.z, hit.x) - uT * 0.5 / pow(r, 1.2);
  vec2 pc = vec2(cos(a), sin(a));
  float clump = fbm(pc * 2.6 + vec2(r * 0.9, r * 0.35));
  float bands = fbm(vec2(r * 17.0, 1.7));
  float fine = vn(pc * 10.0 + r * 3.0);
  float dens = (0.35 + 1.1 * clump) * (0.5 + 0.9 * bands) * (0.7 + 0.6 * fine);
  float prof = pow(max(1.0 - u, 0.0), 1.35) * smoothstep(0.0, 0.03, u);
  vec3 vel = normalize(vec3(-hit.z, 0.0, hit.x)) * sqrt(0.5 / r);          // matter orbiting the hole
  float beta = dot(vel, -v);                                                // speed toward the camera
  float D = sqrt(max(1.0 - dot(vel, vel), 0.01)) / max(1.0 - beta, 0.05);   // Doppler factor
  float ratio = D * sqrt(max(1.0 - 1.0 / r, 0.02));                         // plus gravitational redshift
  float temp = pow(RIN / r, 0.75) * 1.05;
  vec3 e = tc(temp * ratio) * dens * prof * pow(ratio, 3.0) * 2.5;         // beaming: the approaching side is far brighter
  return vec4(e, clamp(dens * prof * 1.7, 0.0, 0.92));
}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float elev = 0.115 + 0.02 * sin(uT * 0.09);
  vec3 ro = vec3(0.0, 13.0 * sin(elev), -13.0 * cos(elev));
  vec3 fw = normalize(-ro), rt = normalize(cross(vec3(0.0, 1.0, 0.0), fw)), up = cross(fw, rt);
  vec3 p = ro, v = normalize(fw * 0.74 + rt * uv.x + up * uv.y);
  vec3 col = vec3(0.0); float trans = 1.0, alive = 1.0;
  float h2 = dot(cross(p, v), cross(p, v));
  for (int i = 0; i < 170; i++) {
    float r = length(p);
    if (r < 1.0) { alive = 0.0; break; }                                   // fell into the horizon
    if (r > 40.0 && dot(p, v) > 0.0) break;                                // escaped
    float dt = min(0.04 + 0.07 * (r - 1.0), 0.75);
    v = normalize(v + (-1.5 * h2 * p / pow(r, 5.0)) * dt);
    vec3 pn = p + v * dt;
    if (p.y * pn.y < 0.0) {                                                // crossed the disk plane
      vec3 hit = mix(p, pn, p.y / (p.y - pn.y)); float hr = length(hit.xz);
      if (hr > RIN && hr < ROUT) { vec4 d = disk(hit, v); col += trans * d.rgb * d.a; trans *= 1.0 - d.a; }
    }
    p = pn;
  }
  col += alive * trans * stars(normalize(v));
  col = 1.0 - exp(-col * 1.55);                                            // filmic-ish tone curve
  col *= 1.0 - 0.38 * dot(uv, uv);
  col += (h21(gl_FragCoord.xy + fract(uT)) - 0.5) * 0.018;
  gl_FragColor = vec4(col, 1.0);
}`;
// Liquid marble: domain-warped noise, drawn by the GPU
const LIQ_FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uT;
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y); }
float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * vn(p); p = p * 2.02 + vec2(1.7, 9.2); a *= 0.5; } return v; }
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y * 2.2;
  float t = uT * 0.06;
  vec2 q = vec2(fbm(uv + t), fbm(uv + vec2(5.2, 1.3) - t));
  vec2 r = vec2(fbm(uv + 4.0 * q + vec2(1.7, 9.2) + 0.15 * t), fbm(uv + 4.0 * q + vec2(8.3, 2.8) + 0.126 * t));
  float f = fbm(uv + 4.0 * r);
  vec3 col = mix(vec3(0.03, 0.0, 0.16), vec3(0.85, 0.18, 0.5), clamp(f * f * 4.0, 0.0, 1.0));
  col = mix(col, vec3(0.0, 0.62, 0.85), clamp(length(q), 0.0, 1.0));
  col = mix(col, vec3(1.0, 0.82, 0.45), clamp(r.x * r.x, 0.0, 1.0) * 0.55);
  col *= 0.35 + 1.1 * f;
  col = pow(col, vec3(0.92));
  col *= 1.0 - 0.3 * dot(uv * 0.45, uv * 0.45);
  gl_FragColor = vec4(col, 1.0);
}`;
// Warp tunnel: glowing grid walls rushing toward you
const TUN_FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uT;
void main(){
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  p += 0.06 * vec2(sin(uT * 0.35), cos(uT * 0.27));
  float r = length(p), a = atan(p.y, p.x);
  float z = 0.5 / (r + 0.003);
  float u = a / 6.28318 * 32.0 + z * 0.35 * sin(uT * 0.15);   // slight twist
  float v = z * 2.2 - uT * 2.4;
  vec2 g = abs(fract(vec2(u, v)) - 0.5);
  float line = smoothstep(0.455, 0.5, max(g.x, g.y));
  float flow = 0.5 + 0.5 * sin(v * 0.35 - uT * 1.6);
  vec3 neon = mix(vec3(0.0, 0.9, 1.0), vec3(1.0, 0.12, 0.8), 0.5 + 0.5 * sin(v * 0.06 + uT * 0.3 + u * 0.02));
  vec3 col = neon * line * (0.45 + 1.4 * flow);
  col += neon * 0.04 * (0.5 + 0.5 * sin(v * 2.0));
  col *= smoothstep(0.0, 0.22, r);                         // dark core
  col *= 0.25 + 0.75 * smoothstep(0.0, 1.1, r);            // far rings fade into the dark
  col += vec3(0.6, 0.3, 1.0) * 0.03 / (r + 0.04);          // glow at the end of the tunnel
  col *= 1.0 - 0.4 * dot(p, p);
  gl_FragColor = vec4(1.0 - exp(-col * 1.6), 1.0);
}`;
// Pulse nebula: a kaleidoscope of flowing colour that swells with the bass and flashes on every beat
const PN_FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uT, uPh; uniform vec4 uAud;
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y); }
float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * vn(p); p = p * 2.02 + vec2(1.7, 9.2); a *= 0.5; } return v; }
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float bass = uAud.x, mid = uAud.y, treb = uAud.z, beat = uAud.w;
  float t = uPh * 0.06;
  vec2 p = uv * (1.7 - 0.28 * beat - 0.35 * bass);
  float a = atan(p.y, p.x) + t * 0.5, r = length(p);
  float seg = 6.28318 / 6.0; a = abs(mod(a, seg) - seg * 0.5);                    // 6-way mirror
  p = r * vec2(cos(a), sin(a));
  vec2 q = vec2(fbm(p * 1.7 + t), fbm(p * 1.7 + vec2(5.2, 1.3) - t));
  float f = fbm(p * 2.3 + 3.0 * q + mid * 0.7);
  vec3 col = mix(vec3(0.07, 0.0, 0.22), vec3(0.95, 0.08, 0.55), clamp(f * f * 4.6, 0.0, 1.0));
  col = mix(col, vec3(0.1, 0.35, 1.0), clamp(q.x * (0.2 + 0.45 * mid) , 0.0, 0.65));
  col += vec3(1.0, 0.6, 0.2) * pow(f, 2.6) * (0.3 + bass * 1.1);
  col *= 0.42 + 0.45 * bass + 0.3 * beat;
  col += vec3(1.0, 0.8, 1.0) * beat * 0.07 * smoothstep(0.9, 0.0, r);                     // flash from the middle on a kick
  col += treb * 0.5 * smoothstep(0.985, 1.0, vn(uv * 70.0 + floor(uT * 10.0)));   // treble sparkles
  col *= 1.0 - 0.35 * dot(uv, uv);
  col = pow(max(col, 0.0), vec3(1.3)) * 1.7;                                        // deeper darks, brighter highlights
  gl_FragColor = vec4(1.0 - exp(-col * 1.1), 1.0);
}`;
// Beat tunnel: the neon tunnel speeds up and flashes with the music
const BT_FRAG = `
precision highp float;
uniform vec2 uRes; uniform float uT, uPh; uniform vec4 uAud;
void main(){
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float bass = uAud.x, mid = uAud.y, treb = uAud.z, beat = uAud.w;
  p *= 1.0 - 0.1 * beat;
  p += 0.05 * vec2(sin(uT * 0.35), cos(uT * 0.27));
  float r = length(p), a = atan(p.y, p.x);
  float z = 0.5 / (r + 0.003);
  float u = a / 6.28318 * 28.0 + z * 0.3 * sin(uT * 0.15);
  float v = z * 2.0 - uPh * 2.6;
  vec2 g = abs(fract(vec2(u, v)) - 0.5);
  float line = smoothstep(0.45 - 0.05 * beat, 0.5, max(g.x, g.y));
  float flow = 0.5 + 0.5 * sin(v * 0.35 - uPh * 1.6);
  vec3 neon = mix(vec3(0.0, 0.9, 1.0), vec3(1.0, 0.12, 0.8), 0.5 + 0.5 * sin(v * 0.06 + uT * 0.3 + mid * 3.0));
  vec3 col = neon * line * (0.4 + 1.2 * flow + 2.6 * beat + 1.2 * bass);
  col += neon * 0.04 * (0.5 + 0.5 * sin(v * 2.0));
  col += vec3(1.0, 0.9, 1.0) * treb * 0.35 * line;
  col *= smoothstep(0.0, 0.2, r) * (0.25 + 0.75 * smoothstep(0.0, 1.1, r));
  col += vec3(0.6, 0.3, 1.0) * (0.03 + 0.12 * beat + 0.06 * bass) / (r + 0.04);
  col *= 1.0 - 0.4 * dot(p, p);
  gl_FragColor = vec4(1.0 - exp(-col * 1.6), 1.0);
}`;
function makeGL(FRAG, MAXW) {
  try {
    const cv = document.createElement('canvas');
    const sc = Math.min(1, (+q.get('q') || innerHeight) / innerHeight);
    const w = Math.min(MAXW, Math.round(innerWidth * sc)), h = Math.max(2, Math.round(w * innerHeight / innerWidth));
    cv.width = w; cv.height = h; cv.style.display = 'block';
    const gl = cv.getContext('webgl', { antialias: false, powerPreference: 'high-performance' });
    if (!gl) return null;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }'));
    gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(pr); if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.viewport(0, 0, w, h); gl.uniform2f(gl.getUniformLocation(pr, 'uRes'), w, h);
    const uT = gl.getUniformLocation(pr, 'uT'), uA = gl.getUniformLocation(pr, 'uAud'), uP = gl.getUniformLocation(pr, 'uPh'), t0 = performance.now(); let last = 0, phase = 0;
    document.body.appendChild(cv);
    const f = (ts) => { raf = requestAnimationFrame(f); if (ts - last < 32) return; const dt = Math.min(0.1, (ts - last) / 1000); last = ts; gl.uniform1f(uT, (performance.now() - t0) / 1000);
      if (uA || uP) { const a = audioLevels(); phase += dt * (1 + a.bass * 5 + a.beat * 7); if (uA) gl.uniform4f(uA, a.bass, a.mid, a.treb, a.beat); if (uP) gl.uniform1f(uP, phase); }
      gl.drawArrays(gl.TRIANGLES, 0, 3); }; // ~30 fps is plenty for slow motion
    gl.uniform1f(uT, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
    return f;
  } catch (e) { console.log('WebGL unavailable, using a simpler version: ' + e.message); return null; }
}

// Loudness of the bass / mids / treble plus a "beat" pulse (1 on a kick, fading back to 0). Gentle idle values when nothing is playing.
const AUD = { bass: 0, mid: 0, treb: 0, beat: 0, live: false, data: null, fast: 0, slow: 0, last: 0 };
function audioLevels() {
  const an = window.__analyser, now = performance.now() / 1000;
  AUD.live = false; AUD.beat *= 0.9;
  if (an) {
    if (!AUD.data || AUD.data.length !== an.frequencyBinCount) AUD.data = new Uint8Array(an.frequencyBinCount);
    an.getByteFrequencyData(AUD.data);
    const d = AUD.data, avg = (x, y) => { let t = 0; for (let i = x; i < y; i++) t += d[i]; return t / Math.max(1, y - x) / 255; };
    const bass = avg(1, 8), kick = avg(1, 4), mid = avg(8, 60), treb = avg(60, 300);
    if (bass + mid + treb > 0.02) {
      AUD.live = true;
      AUD.bass += (bass - AUD.bass) * 0.55; AUD.mid += (mid - AUD.mid) * 0.4; AUD.treb += (treb - AUD.treb) * 0.4;
      AUD.fast += (kick - AUD.fast) * 0.6; AUD.slow += (kick - AUD.slow) * 0.04;                  // quick level vs. the recent average
      if (AUD.fast > AUD.slow * 1.12 + 0.03 && kick > 0.18 && now - AUD.last > 0.2) { AUD.beat = 1; AUD.last = now; } // a kick: clearly above the average
    }
  }
  if (!AUD.live) { AUD.bass = 0.14 + 0.07 * Math.sin(now * 0.9); AUD.mid = 0.12 + 0.05 * Math.sin(now * 0.6 + 1); AUD.treb = 0.08 + 0.04 * Math.sin(now * 1.3 + 2); }
  return AUD;
}
// Audio-reactive scenes listen to the sound your PC is playing (system output, never the microphone).
// main.js allows the capture and calls this; if it fails the visualizer just idles gently.
window.startAudioCapture = async () => {
  try {
    const s = await navigator.mediaDevices.getDisplayMedia({ audio: true, video: true });
    s.getVideoTracks().forEach((t) => t.stop()); // only the sound is wanted
    const ac = new AudioContext(), src = ac.createMediaStreamSource(new MediaStream(s.getAudioTracks())), an = ac.createAnalyser();
    an.fftSize = 2048; an.smoothingTimeConstant = 0.72; src.connect(an); window.__analyser = an; console.log('AUDIO-CAPTURE ok');
  } catch (e) { console.log('AUDIO-CAPTURE failed: ' + e.message); }
};

// Microphone-reactive scenes (voiceorb, claplights). Opt-in: main.js only calls startMic for those scenes, and the app asks first. The sound is analysed here and never recorded or sent anywhere.
const MIC = { level: 0, slow: 0, clap: 0, live: false, data: null, last: 0, tick: -1 };
function micLevels() {
  const an = window.__micAn, now = performance.now() / 1000;
  MIC.clap *= 0.9; MIC.live = false;
  if (an) {
    if (!MIC.data) MIC.data = new Uint8Array(an.frequencyBinCount);
    an.getByteFrequencyData(MIC.data);
    let s = 0; for (let i = 1; i < 120; i++) s += MIC.data[i];
    const lv = Math.min(1, s / 119 / 255 * 3.2);
    MIC.live = true; MIC.level += (lv - MIC.level) * 0.5;
    if (lv > MIC.slow * 1.8 + 0.12 && now - MIC.last > 0.25) { MIC.clap = 1; MIC.last = now; } // a sudden loud sound, like a clap
    MIC.slow += (lv - MIC.slow) * 0.05;
  } else { // demo motion while there is no microphone (and for the preview clips)
    MIC.level = 0.22 + 0.16 * Math.sin(now * 2.1) * Math.sin(now * 0.7);
    const tk = Math.floor(now / 1.6); if (tk !== MIC.tick) { MIC.tick = tk; MIC.clap = 1; }
  }
  return MIC;
}
window.startMic = async () => {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const ac = new AudioContext(), an = ac.createAnalyser(); an.fftSize = 512; an.smoothingTimeConstant = 0.6;
    ac.createMediaStreamSource(s).connect(an); window.__micAn = an; console.log('MIC ok');
  } catch (e) { console.log('MIC failed: ' + e.message); }
};

window.setVolume = (n) => { v.muted = n <= 0; v.volume = Math.max(0, Math.min(1, n / 100)); };

window.setPaused = (p) => {
  paused = p;
  if (type === 'video') { if (window.__gifDec) { window.__gifHold = p; if (window.__gifs) window.__gifs.slice(1).forEach((g) => { if (p) g.removeAttribute('src'); else g.src = url; }); return; } if (window.__gifs) window.__gifs.forEach((g) => { if (p) g.removeAttribute('src'); else g.src = url; }); else p ? v.pause() : v.play(); return; } // a GIF can't be paused, so it is unloaded while a game runs
  if (frame) { cancelAnimationFrame(raf); if (!p) raf = requestAnimationFrame(frame); }
};

// GIFs and videos are drawn on the GPU when they need it: a lower render resolution (q), a different way of enlarging (sharp), or any GIF
// (the browser's own enlarging is soft and shows the GIF's dots). Bicubic family filter: smooth = hides dots, normal = crisp, sharp = crisper.
const MEDIA_FRAG = `
precision highp float;
uniform sampler2D uTex; uniform vec2 uSrc, uOut, uBC; uniform float uFit, uBic; varying vec2 vUv;
float bc(float x){ x = abs(x); float B = uBC.x, C = uBC.y;
  if (x < 1.0) return ((12.0 - 9.0 * B - 6.0 * C) * x * x * x + (-18.0 + 12.0 * B + 6.0 * C) * x * x + (6.0 - 2.0 * B)) / 6.0;
  if (x < 2.0) return ((-B - 6.0 * C) * x * x * x + (6.0 * B + 30.0 * C) * x * x + (-12.0 * B - 48.0 * C) * x + (8.0 * B + 24.0 * C)) / 6.0;
  return 0.0; }
void main(){
  float sa = uSrc.x / uSrc.y, oa = uOut.x / uOut.y; vec2 r;
  if (uFit < 0.5) r = oa > sa ? vec2(1.0, sa / oa) : vec2(oa / sa, 1.0);   // fill: crop to cover the screen
  else r = oa > sa ? vec2(oa / sa, 1.0) : vec2(1.0, sa / oa);              // fit: show the whole picture
  vec2 s = (vUv - 0.5) * r + 0.5;
  if (s.x < 0.0 || s.x > 1.0 || s.y < 0.0 || s.y > 1.0) { gl_FragColor = vec4(0.0); return; }
  if (uBic < 0.5) { gl_FragColor = vec4(texture2D(uTex, s).rgb, 1.0); return; }   // shrinking: plain smooth sampling is right
